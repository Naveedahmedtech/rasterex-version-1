<!-- Annotation Tools Container -->
<div class="annotation-tools-container" *ngIf="(opened$ | async) && sessionContext.isFileReady">

  <!-- âœ… Create Issue Button -->
  <button
    *ngIf="(canAddAnnotation | async) && !(guiConfig$ | async)?.disableMarkupShapeButton && !annotationCreated && !(service.openIssueForm$ | async) && mode === 'annotation'"
    class="create-issue-btn-floating button-fixed-bottom"
    (click)="startEllipseIssue($event)"
  >
    Create Issue
  </button>

  <!-- âœ… Signature Buttons (Create, Save, Delete) -->
  <div *ngIf="!sessionContext.isSigned && mode === 'signature' && !signaturedSaved">

    <button
      *ngIf="(canAddAnnotation | async) && !(guiConfig$ | async)?.disableMarkupShapeButton && !annotationCreated && !(service.openIssueForm$ | async) && !signatureCreated"
      class="create-issue-btn-floating button-fixed-bottom"
      (click)="openSignatureModal()"
    >
      Create Signature
    </button>

    <div class="signature-button-group" *ngIf="signatureCreated">
      <button
        class="create-issue-btn-floating"
        [disabled]="savingSignature"
        (click)="saveSignature()">
        <ng-container *ngIf="!savingSignature">Save</ng-container>
        <ng-container *ngIf="savingSignature">
          <span class="spinner"></span> Saving...
        </ng-container>
      </button>


      <button class="create-issue-btn-floating delete" (click)="deleteSignature()">Reset</button>
    </div>

  </div>

  <!-- âœ… Confirm Annotation Button -->
  <button *ngIf="annotationCreated && mode === 'annotation'"
          class="create-issue-btn-floating button-fixed-bottom"
          (click)="confirmAnnotation()"
  >
    Next
  </button>

  <!-- ðŸ§© Annotation Panels -->
  <div class="annotation-panels-container">
    <rx-erase-panel></rx-erase-panel>
    <rx-count-panel *ngIf="isActionSelected['COUNT']"></rx-count-panel>
    <rx-stamp-panel *ngIf="isActionSelected['STAMP']" (onClose)="onActionSelect('STAMP')"></rx-stamp-panel>
    <rx-image-library *ngIf="isActionSelected['IMAGES_LIBRARY']" (onClose)="onActionSelect('IMAGES_LIBRARY')"></rx-image-library>
    <rx-symbols-library *ngIf="isActionSelected['SYMBOLS_LIBRARY']" (onClose)="onActionSelect('SYMBOLS_LIBRARY')"></rx-symbols-library>
    <rx-links-library *ngIf="isActionSelected['LINKS_LIBRARY']" (onClose)="onActionSelect('LINKS_LIBRARY')"></rx-links-library>
    <rx-measure-panel></rx-measure-panel>
  </div>

</div>

<!-- ðŸ› ï¸ Global Tools -->
<rx-context-editor></rx-context-editor>
<rx-quick-actions-menu></rx-quick-actions-menu>
<rx-note-popover></rx-note-popover>
<rx-note-popover [mode]="'tooltip'"></rx-note-popover>
<rx-measure-detail-panel *ngIf="!(guiConfig$ | async).disableMarkupMeasureButton"></rx-measure-detail-panel>

<rx-signature-modal *ngIf="(service.signatureModalOpen$ | async)"></rx-signature-modal>
