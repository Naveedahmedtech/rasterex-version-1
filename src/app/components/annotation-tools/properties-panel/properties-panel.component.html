<rx-panel *ngIf="visible" title="Issue Details" (onClose)="onClose()">
  <div class="properties-panel-container">

    <!-- Info Section: visible only when the form is collapsed -->
    <div *ngIf="!showForm" class="block-section">
      <div class="info-container">
        <ng-container *ngFor="let item of infoData | keyvalue">
          <div class="row-header">{{ item.key }}</div>

          <!-- Textual values -->
          <div *ngIf="item.key !== 'file'" class="info-value">
            {{ item.value }}
          </div>

          <!-- File/Image Preview -->
          <div *ngIf="item.key === 'file'">
            <ng-container *ngIf="isValidImageUrl(item.value); else fallback">
              <a [href]="item.value" target="_blank">
                <img
                  [src]="item.value"
                  alt="Attached Issue File"
                  (error)="imageError = true"
                  *ngIf="!imageError"
                  class="preview-image"
                />
              </a>
            </ng-container>

            <!-- Fallback display -->
            <ng-template #fallback>
              <div class="image-error">
                No preview available.
                <a *ngIf="item.value" [href]="item.value" target="_blank" rel="noopener">Open File</a>
              </div>
            </ng-template>
          </div>
        </ng-container>
      </div>


      <!-- Delete Button -->
      <div class="btn-group" style="justify-content: flex-start; margin-top: 12px;" *ngIf="formTitle">
        <button class="delete-button" (click)="onDelete()" aria-label="Delete Issue">
          Delete
        </button>
      </div>
    </div>

    <!-- Form Block -->
    <div class="block-section" *ngIf="showForm">
      <div class="form-section">
        <!-- Title Field -->
        <section class="field">
          <label for="formTitle">Title <span class="required">*</span></label>
          <input
            id="formTitle"
            type="text"
            [(ngModel)]="formTitle"
            placeholder="Enter title"
            aria-required="true"
          />
        </section>

        <!-- Description Field -->
        <section class="field">
          <label for="formDescription">Description</label>
          <textarea
            id="formDescription"
            [(ngModel)]="formDescription"
            placeholder="Enter description"
          ></textarea>
        </section>

        <!-- Capture Image from Camera -->
        <section class="field">
          <label for="issue-image">Attach Image (Take Photo)</label>
          <input
            type="file"
            id="issue-image"
            (change)="onFileSelected($event)"
            accept="image/*"
            capture="environment"
          />
        </section>

        <!-- Messages -->
        <div *ngIf="successMessage" class="alert success">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert error">{{ errorMessage }}</div>
        <div *ngIf="isLoading" class="loading-spinner">Saving...</div>

        <!-- Action Buttons -->
        <div class="btn-group">
          <button (click)="onSave()" [disabled]="isLoading || !formTitle">
            Save
          </button>
          <button (click)="onCancel()" [disabled]="isLoading">
            Cancel
          </button>
        </div>
      </div>
    </div>

  </div>
</rx-panel>
