<rx-panel *ngIf="visible" title="Issue Details" (onClose)="onClose()">

  <div class="properties-panel-container">

    <!-- Info Section: visible only when the form is collapsed -->
    <div *ngIf="isFormCollapsed && isInfoTabVisible" class="block-section">
      <div class="info-container">
        <ng-container *ngFor="let item of infoData | keyvalue">
          <div class="row-header">{{ item.key }}</div>
          <div>{{ item.value }}</div>
        </ng-container>
      </div>
    </div>


    <!-- Form Block -->
    <!-- Form Block: hidden if title exists -->
    <div class="block-section">
      <div class="form-toggle" (click)="toggleForm()">
        <span>{{ isFormCollapsed ? 'Add issue details' : 'Show info details' }}</span>
        <i [ngClass]="isFormCollapsed ? 'icon-down' : 'icon-up'"></i>
      </div>

      <div class="form-section" *ngIf="!isFormCollapsed">
        <section class="field">
          <label for="formTitle">Title <span class="required">*</span></label>
          <input id="formTitle" type="text" [(ngModel)]="formTitle" placeholder="Enter title" />
        </section>

        <section class="field">
          <label for="formDescription">Description</label>
          <textarea id="formDescription" [(ngModel)]="formDescription" placeholder="Enter description"></textarea>
        </section>

        <!-- Messages -->
        <div *ngIf="successMessage" class="alert success">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="alert error">{{ errorMessage }}</div>
        <div *ngIf="isLoading" class="loading-spinner">Saving...</div>

        <!-- Buttons -->
        <div class="btn-group">
          <button (click)="onSave()" [disabled]="isLoading || !formTitle">Save</button>
          <button (click)="onCancel()" [disabled]="isLoading">Cancel</button>
        </div>
      </div>
    </div>

  </div>
</rx-panel>
