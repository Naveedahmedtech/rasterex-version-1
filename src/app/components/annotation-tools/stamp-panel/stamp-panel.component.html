<rx-panel
  [title]="'Signature'"
  (onClose)="onPanelClose()"
  [ngStyle]="{ 'overflow-y': 'hidden' }"
>
  <div class="stamp-panel-container">
    <section *ngIf="activeIndexStamp === 1">
      <!-- Toolbar -->
      <div
        class="signature-toolbar"
        role="toolbar"
        aria-label="Signature tools"
        [ngStyle]="{ '--ink': textColor }"
      >
        <div class="toolbar-left">
          <label class="ctrl">
            <span>Color</span>
            <input
              type="color"
              [value]="textColor"
              (input)="onColorSelect($any($event.target).value)"
              aria-label="Ink color"
            />
          </label>

          <div class="ctrl">
            <span>Thickness</span>
            <div class="thickness-group" role="group" aria-label="Pen thickness">
              <button
                type="button"
                class="chip thin"
                [class.active]="selectedThickness === 1"
                [attr.aria-pressed]="selectedThickness === 1"
                (click)="setPenWidth(1)"
              >
                <span class="chip-dot" aria-hidden="true"></span>
                Thin
              </button>
              <button
                type="button"
                class="chip med"
                [class.active]="selectedThickness === 2"
                [attr.aria-pressed]="selectedThickness === 2"
                (click)="setPenWidth(2)"
              >
                <span class="chip-dot" aria-hidden="true"></span>
                Med
              </button>
              <button
                type="button"
                class="chip thick"
                [class.active]="selectedThickness === 3"
                [attr.aria-pressed]="selectedThickness === 3"
                (click)="setPenWidth(3)"
              >
                <span class="chip-dot" aria-hidden="true"></span>
                Thick
              </button>
            </div>
          </div>
        </div>

        <div class="toolbar-right">
          <button
            class="btn ghost"
            type="button"
            (click)="undoSignature()"
            [disabled]="!sigPad || sigPad.isEmpty()"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 7v4h4M7 11a7 7 0 1 0 2.05-4.95L7 7" />
            </svg>
            Undo
          </button>
          <button
            class="btn ghost"
            type="button"
            (click)="clearSignature()"
            [disabled]="!sigPad || sigPad.isEmpty()"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 6h18M8 6l1 12h6l1-12M10 6V4h4v2" />
            </svg>
            Clear
          </button>
          <button
            class="btn primary"
            type="button"
            (click)="saveSignatureAsStandardStamp()"
            [disabled]="!sigPad || sigPad.isEmpty()"
          >
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 20h14V7l-3-3H5zM9 20v-6h6v6" />
            </svg>
            Save
          </button>
        </div>
      </div>

      <!-- Signature canvas -->
      <div class="sig-wrap" aria-label="Signature canvas">
        <canvas #signatureCanvas></canvas>
      </div>

      <!-- Latest signature list -->
      <div class="templates-list" [class.empty]="!templates?.length" aria-label="Saved signatures">
        <ng-container *ngIf="templates?.length; else emptyState">
          <div class="stamp-item" *ngFor="let template of templates; index as i">
            <img
              [stampTemplate]="template"
              [src]="template.src"
              [ngStyle]="{
                'width.px': template.width,
                'height.px': template.height
              }"
              alt="Saved signature"
            />
            <button
              title="Delete"
              class="icon-btn"
              *ngIf="isAdmin"
              (click)="deleteStandardStamp(template.id)"
              aria-label="Delete signature"
              type="button"
            >
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 6h18M8 6l1 12h6l1-12M10 6V4h4v2" />
              </svg>
            </button>
          </div>
        </ng-container>

        <ng-template #emptyState>
          <div class="empty">
            <div class="title">No signatures yet</div>
            <div class="hint">Draw above and press <b>Save</b>.</div>
          </div>
        </ng-template>
      </div>
    </section>
  </div>
</rx-panel>
