<rx-panel
  [title]="'Signature'"
  (onClose)="onPanelClose()"
  [ngStyle]="{ 'overflow-y': 'hidden' }"
>
  <div class="stamp-panel-container">
    <section *ngIf="activeIndexStamp === 1">
      <!-- Toggleable styles -->
      <details class="signature-styles">
        <summary>Click to choose Styles</summary>
        <div class="signature-toolbar" [ngStyle]="{ '--ink': textColor }">
          <label class="ctrl">
            <span> <span class="material-icons">palette</span> Color </span>
            <input
              type="color"
              [value]="textColor"
              (input)="onColorSelect($any($event.target).value)"
              aria-label="Ink color"
            />
          </label>
          <div class="ctrl">
            <span> <span class="material-icons">edit</span> Thickness </span>
            <div
              class="thickness-group"
              role="group"
              aria-label="Pen thickness"
            >
              <button
                type="button"
                class="chip thin"
                [class.active]="selectedThickness === 1"
                [attr.aria-pressed]="selectedThickness === 1"
                (click)="setPenWidth(1)"
              >
                <span class="chip-dot"></span> Thin
              </button>
              <button
                type="button"
                class="chip med"
                [class.active]="selectedThickness === 2"
                [attr.aria-pressed]="selectedThickness === 2"
                (click)="setPenWidth(2)"
              >
                <span class="chip-dot"></span> Med
              </button>
              <button
                type="button"
                class="chip thick"
                [class.active]="selectedThickness === 3"
                [attr.aria-pressed]="selectedThickness === 3"
                (click)="setPenWidth(3)"
              >
                <span class="chip-dot"></span> Thick
              </button>
            </div>
          </div>
        </div>
      </details>

      <!-- Signer Info -->
      <!-- Signer Info -->
      <div class="signer-info">
        <!-- Name -->
        <label class="ctrl">
          <span> <span class="material-icons">person</span> Name </span>
          <input
            type="text"
            name="signerName"
            [(ngModel)]="signerName"
            #nameCtrl="ngModel"
            required
            (ngModelChange)="
              annotationToolService.setSignerInfo(signerName, signerEmail)
            "
            placeholder="Enter your full name"
          />
          <div class="error" *ngIf="nameCtrl.invalid && nameCtrl.touched">
            Name is required.
          </div>
        </label>

        <!-- Email -->
        <label class="ctrl">
          <span> <span class="material-icons">email</span> Email </span>
          <input
            type="email"
            name="signerEmail"
            [(ngModel)]="signerEmail"
            #emailCtrl="ngModel"
            required
            email
            (ngModelChange)="
              annotationToolService.setSignerInfo(signerName, signerEmail)
            "
            placeholder="Enter your email"
          />
          <div class="error" *ngIf="emailCtrl.invalid && emailCtrl.touched">
            <span class="error" *ngIf="emailCtrl.errors?.['required']"
              >Email is required.</span
            >
            <span class="error" *ngIf="emailCtrl.errors?.['email']"
              >Enter a valid email address.</span
            >
          </div>
        </label>
      </div>

      <!-- Signature canvas -->
      <div class="sig-wrap" aria-label="Signature canvas">
        <canvas #signatureCanvas></canvas>
      </div>

      <!-- Actions: Undo, Clear, Save -->
      <div
        class="signature-actions_"
        role="group"
        aria-label="Signature actions"
      >
        <button
          class="btn ghost"
          type="button"
          (click)="undoSignature()"
          [disabled]="!sigPad || sigPad.isEmpty()"
        >
          <span class="material-icons">undo</span> Undo
        </button>
        <button
          class="btn ghost"
          type="button"
          (click)="clearSignature()"
          [disabled]="!sigPad || sigPad.isEmpty()"
        >
          <span class="material-icons">clear</span> Clear
        </button>
        <button
          class="btn primary"
          type="button"
          (click)="saveSignatureAsStandardStamp()"
          [disabled]="
            !signerName || !signerEmail || !sigPad || sigPad.isEmpty()
          "
        >
          <span class="material-icons">save</span> Save
        </button>
      </div>

      <div *ngIf="templates?.length" class="save-context-hint">
        <span class="next-step"
          >Just drag it from the list below into your document.</span
        >
      </div>

      <!-- Saved signature list -->
      <div
        #savedList
        class="templates-list"
        [class.empty]="!templates?.length"
        aria-label="Saved signatures"
      >
        <ng-container *ngIf="templates?.length; else emptyState">
          <div
            class="stamp-item"
            *ngFor="let template of templates; index as i"
          >
            <img
              [stampTemplate]="template"
              [src]="template.src"
              [ngStyle]="{
                'width.px': template.width,
                'height.px': template.height
              }"
              alt="Saved signature"
              draggable="true"
            />
            <button
              title="Delete"
              class="icon-btn"
              *ngIf="isAdmin"
              (click)="deleteStandardStamp(template.id)"
              aria-label="Delete signature"
              type="button"
            >
              <span class="material-icons">delete</span>
            </button>
          </div>
        </ng-container>

        <ng-template #emptyState>
          <div class="empty">
            <div class="title">No signatures yet</div>
            <div class="hint">
              Draw above and press <b>Save</b>. Then drag your saved signature
              into the document.
            </div>
          </div>
        </ng-template>
      </div>
    </section>
  </div>
</rx-panel>
